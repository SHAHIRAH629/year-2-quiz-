<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0}</style>
</head><body>
<title>World Explorers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: chunky cartoon "sticker" panels (thick ink outline + hard offset shadow) on a sky-and-hills backdrop.
   Header HUD, 4-stop trail, one task screen at a time, mascot band at the bottom. Country colours: AU orange, CA red, UK blue. */
:root{
  --ink:#1e2a5a; --ink-soft:#4a5788; --paper:#ffffff; --cream:#fff7de;
  --sun:#ffc93c; --coral:#ff6a5c; --leaf:#2fb36b; --grape:#7a5cff;
  --au:#ff9f1c; --ca:#e63946; --uk:#2f5fd0;
  --good:#1f9d57; --good-bg:#dcf8e6; --soft:#c26a00; --soft-bg:#fff0d6;
  --font-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  font-family:var(--font-body); font-size:clamp(17px,.9vw + 13px,22px); line-height:1.4;
  color:var(--ink); background:#d9f2ff;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px 28px;
}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button,[role="button"],input{touch-action:manipulation}
:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}

/* backdrop */
.scenery{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:linear-gradient(#8fd6ff 0%,#c9edff 55%,#eafaff 100%)}
.scenery .cl{position:absolute;opacity:.95;animation:drift 70s linear infinite}
.scenery .c1{top:6%;left:-12%;width:210px}
.scenery .c2{top:20%;left:-20%;width:150px;animation-duration:95s;animation-delay:-30s}
.scenery .c3{top:11%;left:-15%;width:180px;animation-duration:120s;animation-delay:-70s}
.scenery .bl{position:absolute;width:70px;animation:bob 6s ease-in-out infinite}
.scenery .b1{top:26%;right:4%}
.scenery .b2{top:48%;left:2%;width:54px;animation-delay:-2s}
.scenery .hills{position:absolute;left:0;bottom:0;width:100%;height:24vh}
@keyframes drift{to{transform:translateX(130vw)}}
@keyframes bob{50%{transform:translateY(-14px) rotate(3deg)}}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:clamp(48px,7vw,68px);height:auto;flex:none}
.brand h1{font-size:clamp(1.5rem,3.6vw,2.5rem);text-transform:uppercase;letter-spacing:.03em;text-shadow:0 3px 0 #fff}
.brand p{font-family:var(--font-display);font-weight:600;color:var(--uk);font-size:clamp(.95rem,1.8vw,1.25rem);letter-spacing:.04em;text-transform:uppercase}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pill{display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:5px 14px;font-family:var(--font-display);font-weight:600;font-size:1.1rem;box-shadow:0 4px 0 var(--ink);font-variant-numeric:tabular-nums}
.pill svg{width:1.3em;height:1.3em;fill:var(--sun);stroke:var(--ink);stroke-width:2}
.pill small{font-family:var(--font-body);font-weight:800;font-size:.7em;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.pill.pop{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.18) rotate(-3deg)}}
.snd{width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;padding:0}
.snd svg{width:28px;height:28px}
.snd[aria-pressed="true"]{background:#e3e6f2}
.snd:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

.meter{display:grid;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:10px 16px}
.trail{list-style:none;margin:0;padding:0;display:flex;justify-content:space-between;gap:6px}
.trail li{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;font-family:var(--font-display);font-weight:600;font-size:.9rem;color:var(--ink-soft);min-width:0}
.trail li::after{content:"";position:absolute;top:17px;left:calc(50% + 22px);right:calc(-50% + 22px);height:5px;border-radius:3px;background:#d4dbef}
.trail li:last-child::after{display:none}
.trail i{font-style:normal;width:36px;height:36px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;font-size:1.1rem;color:var(--ink);position:relative;z-index:1}
.trail li.done i{background:var(--leaf);color:#fff}
.trail li.done::after{background:var(--leaf)}
.trail li.now i{background:var(--sun);animation:pulse 1.6s ease-in-out infinite}
.trail li.now{color:var(--ink)}
@keyframes pulse{50%{transform:scale(1.15)}}
.barrow{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:16px;border-radius:999px;background:#e3e9f8;border:3px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--leaf) 0 12px,#45cf84 12px 24px);transition:width .5s ease}
.barrow span{font-family:var(--font-display);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.starrow{display:flex;flex-wrap:wrap;gap:3px}
.starrow svg{width:22px;height:22px;fill:#e1e6f4;stroke:#c3cbe4;stroke-width:1.5;transition:transform .3s}
.starrow svg.on{fill:var(--sun);stroke:var(--ink);stroke-width:2;transform:scale(1.12)}

/* panels */
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:30px;box-shadow:0 8px 0 var(--ink);padding:clamp(16px,2.6vw,30px);min-width:0}
.badge{display:inline-block;font-family:var(--font-display);font-weight:600;font-size:.95rem;letter-spacing:.05em;text-transform:uppercase;background:var(--grape);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px 14px}
.lead{font-size:1.25em;font-weight:700}
.tiny{font-size:.8em;color:var(--ink-soft);font-weight:700}
.btn{font-family:var(--font-display);font-weight:600;font-size:1.3rem;background:var(--sun);color:var(--ink);border:4px solid var(--ink);border-radius:999px;padding:.55em 1.5em;min-height:60px;box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--ink)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.go{background:var(--leaf);color:#fff;text-shadow:0 2px 0 rgba(30,42,90,.35)}
.btn.alt{background:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:0 6px 0 var(--ink)}
.icon-btn{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);box-shadow:0 4px 0 var(--ink);padding:0;vertical-align:middle;flex:none}
.icon-btn svg{width:26px;height:26px}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.nav{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end;margin-top:14px}

/* art */
.scene{border:4px solid var(--ink);border-radius:22px;overflow:hidden;background:#cfeeff;line-height:0}
.scene svg.art{display:block;width:100%;height:auto;aspect-ratio:4/3}
.flag{display:block;width:100%;height:auto;border-radius:6px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:center}
.hero h2{font-size:clamp(2rem,4.6vw,3.2rem)}
.hero .stack{display:grid;gap:14px;justify-items:start}
.hero label{font-weight:800}
.hero input,.own input{font:inherit;font-weight:700;width:100%;max-width:420px;padding:.6em .9em;border:4px solid var(--ink);border-radius:18px;background:#fffdf5;color:var(--ink);min-height:56px}
.au{color:#c46a00}.ca{color:var(--ca)}.uk{color:var(--uk)}
.hero-art>svg{width:100%;max-width:380px;height:auto;display:block;margin:0 auto}
.intro{display:grid;gap:16px;justify-items:center;text-align:center}
.intro h2{font-size:clamp(1.8rem,4vw,2.8rem)}
.fl3{display:flex;gap:16px;width:min(100%,460px)}
.fl3>div{flex:1;border:3px solid var(--ink);border-radius:10px;overflow:hidden;box-shadow:0 4px 0 var(--ink)}
.say-row{display:flex;gap:12px;align-items:center;justify-content:center}

/* questions */
.qhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.q-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(16px,3vw,30px);align-items:start}
.qtext{font-size:clamp(1.4rem,2.8vw,2.1rem);display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.6vw,16px)}
.opt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 8px 12px;background:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);font-family:var(--font-display);font-weight:600;font-size:clamp(1.05rem,2.1vw,1.55rem);min-height:120px;position:relative;transition:transform .1s,box-shadow .1s,background .15s}
.opt .fb-flag{width:100%;border:2px solid var(--ink);border-radius:8px;overflow:hidden;line-height:0}
.opt:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 9px 0 var(--ink)}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.opt[aria-pressed="true"]{background:#fff3c4;outline:5px solid var(--sun);outline-offset:2px}
.opt.right{background:var(--good-bg);border-color:var(--good);box-shadow:0 6px 0 var(--good)}
.opt.right::after{content:"\2713";position:absolute;top:-14px;right:-10px;width:38px;height:38px;border-radius:50%;background:var(--good);color:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-size:1.3rem;line-height:1}
.opt.wrong{background:var(--soft-bg);border-color:#e08a2e;box-shadow:0 6px 0 #e08a2e;animation:shake .45s}
.opt:disabled{cursor:default}
.opt.dim{opacity:.5}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.fb{min-height:3.2em;margin-top:16px;padding:10px 14px;border-radius:18px;border:3px dashed transparent;font-weight:800;font-size:1.05em}
.fb:empty{padding:0;min-height:0;margin:0}
.fb.good{background:var(--good-bg);border-color:var(--good);color:#0f6b3a}
.fb.soft{background:var(--soft-bg);border-color:#e08a2e;color:var(--soft)}

/* listening */
.listen{display:grid;justify-items:center;gap:16px;text-align:center}
.bigplay{width:clamp(130px,20vw,170px);aspect-ratio:1;border-radius:50%;border:5px solid var(--ink);background:var(--coral);box-shadow:0 9px 0 var(--ink);display:grid;place-items:center;padding:0;position:relative;color:#fff}
.bigplay svg{width:52%;height:52%;fill:#fff;stroke:#fff}
.bigplay:active{transform:translateY(6px);box-shadow:0 3px 0 var(--ink)}
.bigplay.pulse{animation:pulse 1.2s ease-in-out infinite}
.bigplay.playing::before,.bigplay.playing::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:4px solid var(--coral);animation:ring 1.2s ease-out infinite}
.bigplay.playing::after{animation-delay:.6s}
@keyframes ring{from{transform:scale(.85);opacity:.9}to{transform:scale(1.25);opacity:0}}
.playlbl{font-family:var(--font-display);font-weight:600;font-size:1.3rem}
.listen .opts{width:min(100%,640px)}
.script{background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:10px 16px;font-weight:700;max-width:640px}
.ttsnote{max-width:640px;background:var(--soft-bg);border:3px solid #e08a2e;border-radius:16px;padding:10px 14px;font-weight:700;display:grid;gap:8px;justify-items:start}
.tickwrap{overflow-x:auto;max-width:100%;margin-top:18px}
.tick{border-collapse:separate;border-spacing:0;margin:0 auto;border:3px solid var(--ink);border-radius:14px;overflow:hidden;font-family:var(--font-display);font-weight:600}
.tick th,.tick td{border:1px solid #c9d3ee;text-align:center;padding:4px 0;width:clamp(36px,7vw,64px);height:36px}
.tick th{background:var(--cream)}
.tick td.fl{width:70px;padding:3px 6px}
.tick td .ok{color:var(--good);font-size:1.4rem;line-height:1}
.tick td .miss{color:#aab3d1;font-size:1.4rem;line-height:1}
.tick td.cur{background:#fff3c4}

/* matching */
.mgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-content:start}
.pcard{background:#fff;border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:6px 6px 8px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;display:grid;gap:6px;text-align:center;font-family:var(--font-display);font-weight:600;transition:transform .12s}
.pcard .scene{border-width:3px;border-radius:14px;pointer-events:none}
.pcard span{font-size:.92rem;line-height:1.1;pointer-events:none}
.pcard:hover{transform:translateY(-3px) rotate(-1deg)}
.pcard.selected{outline:5px solid var(--sun);outline-offset:2px;transform:translateY(-4px) rotate(-1.5deg)}
.pcard.lifted{opacity:.35}
.pcard.ghost{position:fixed;z-index:60;pointer-events:none;transform:rotate(-4deg) scale(1.05);box-shadow:0 14px 24px rgba(30,42,90,.35);opacity:.97}
.pcard.shake{animation:shake .45s}
.pcard.placed{cursor:default;box-shadow:0 3px 0 var(--ink);border-width:3px;padding:4px 4px 6px}
.pcard.placed:hover{transform:none}
.pcard.placed span{font-size:.8rem}
.pcard.revealed{outline:4px dashed #e08a2e;outline-offset:1px}
.buckets{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.bucket{border:4px dashed var(--ink);border-radius:24px;padding:10px 12px;min-height:130px;display:grid;grid-template-rows:auto 1fr;gap:8px;transition:background .15s,transform .15s}
.bucket.au{background:#fff1d3;color:var(--ink);border-color:#d77f00}
.bucket.ca{background:#ffe1e3;color:var(--ink);border-color:#c42535}
.bucket.uk{background:#dfe8ff;color:var(--ink);border-color:#2449a8}
.bucket .bhead{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:1.4rem}
.bucket .bhead .flag{width:60px;border:2px solid var(--ink);border-radius:6px}
.bucket .drop{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;align-content:start}
.bucket.hot{box-shadow:0 0 0 5px var(--sun);cursor:pointer}
.bucket.over{transform:scale(1.03);box-shadow:0 0 0 6px var(--leaf)}

/* writing */
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px}
.ccard{border:4px solid var(--ink);border-radius:22px;overflow:hidden;background:#fff;display:grid;grid-template-rows:auto 1fr;box-shadow:0 6px 0 var(--ink)}
.ccard .scene{border:0;border-bottom:4px solid var(--ink);border-radius:0}
.ccard .scene svg.art{aspect-ratio:16/8}
.ccard .words{padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.ccard h3{padding:8px 12px 0;font-size:1.5rem;display:flex;align-items:center;gap:10px}
.ccard h3 .flag{width:44px;border:2px solid var(--ink);border-radius:5px}
.ccard.au h3{color:#b35e00}.ccard.ca h3{color:var(--ca)}.ccard.uk h3{color:var(--uk)}
.chip{font:inherit;font-weight:800;border:3px solid var(--ink);border-radius:999px;background:#fff;padding:.25em .85em;min-height:44px;box-shadow:0 3px 0 var(--ink);transition:transform .08s}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.chip.au{background:#ffe3ae}.chip.ca{background:#ffc9cd}.chip.uk{background:#cddcff}.chip.xx{background:#e6dcff}
.sub{font-family:var(--font-display);font-weight:600;font-size:1.15rem;margin:18px 0 8px}
.starters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px}
.starters button{font-family:var(--font-display);font-weight:600;font-size:1.15rem;background:#fff;border:4px solid var(--ink);border-radius:18px;padding:.5em .8em;min-height:56px;box-shadow:0 4px 0 var(--ink)}
.starters button[aria-pressed="true"]{background:var(--sun)}
.builder{margin-top:14px;background:var(--cream);border:4px solid var(--ink);border-radius:22px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-family:var(--font-display);font-weight:600;font-size:clamp(1.3rem,2.6vw,2rem);min-height:90px}
.slot{font:inherit;min-width:140px;min-height:52px;padding:.1em .6em;border:4px dashed var(--ink-soft);border-radius:14px;background:#fff;color:var(--ink-soft)}
.slot.active{border-color:var(--grape);background:#f1ecff}
.slot.filled{border-style:solid;border-color:var(--ink);color:var(--ink);background:#fff}
.own{margin-top:14px;display:grid;gap:6px}
.own label{font-weight:800}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
.sample{margin-top:14px;display:grid;gap:10px}
.sample .bubble2{border:3px solid var(--ink);border-radius:18px;padding:10px 14px;background:#fff;font-weight:700}
.sample .bubble2 b{font-family:var(--font-display);display:block;font-size:.85em;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft)}
.sample .bubble2.mine{background:#e7fbe9}

/* final */
.final{display:grid;gap:18px;justify-items:center;text-align:center}
.final h2{font-size:clamp(2rem,5vw,3.6rem);color:var(--grape)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px;width:100%}
.stat{border:4px solid var(--ink);border-radius:22px;padding:12px;background:#fff;box-shadow:0 6px 0 var(--ink)}
.stat b{display:block;font-family:var(--font-display);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;font-size:.8em}
.stat:nth-child(1) b{color:var(--grape)}.stat:nth-child(2) b{color:var(--good)}.stat:nth-child(3) b{color:#d98a00}
.cert{width:min(100%,780px);background:var(--cream);border:6px double var(--ink);outline:6px solid var(--sun);outline-offset:-18px;border-radius:26px;padding:clamp(22px,4vw,40px);display:grid;gap:10px;justify-items:center;box-shadow:0 8px 0 var(--ink)}
.cert .ribbon{font-family:var(--font-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--coral);color:#fff;border:3px solid var(--ink);padding:4px 22px;border-radius:8px;font-size:clamp(.9rem,2vw,1.2rem)}
.cert svg.trophy{width:clamp(110px,18vw,150px);height:auto}
.cert .nm{font-family:var(--font-display);font-weight:700;font-size:clamp(1.8rem,5vw,3rem);color:var(--uk);border-bottom:4px dotted var(--ink-soft);padding:0 20px;min-width:min(100%,320px);overflow-wrap:anywhere}
.cert .fl3{width:min(100%,300px)}
.bigstars{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.bigstars svg{width:30px;height:30px;fill:var(--sun);stroke:var(--ink);stroke-width:2}
.bigstars svg.off{fill:#e6eaf6;stroke:#c3cbe4}

/* mascots */
.band{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:10px 24px;margin-top:6px}
.trio{display:flex;align-items:flex-end;gap:clamp(4px,2vw,20px)}
.m{width:clamp(76px,13vw,140px);height:auto;display:block;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
.trio .m:nth-child(2){animation-delay:-1s}.trio .m:nth-child(3){animation-delay:-2s}
@keyframes breathe{50%{transform:scaleY(1.03) translateY(-2px)}}
.band.dance .m{animation:hop .6s ease-in-out 3}
.band.dance .m:nth-child(2){animation-delay:.12s}.band.dance .m:nth-child(3){animation-delay:.24s}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-30px) rotate(-7deg)}60%{transform:translateY(0) rotate(6deg)}80%{transform:translateY(-14px) rotate(-3deg)}}
.band.tilt .m{animation:tilt .9s ease 1}
@keyframes tilt{30%{transform:rotate(-6deg)}60%{transform:rotate(5deg)}}
.bubble{position:relative;max-width:min(100%,460px);min-height:3.4em;display:flex;align-items:center;background:#fff;border:4px solid var(--ink);border-radius:24px;padding:10px 18px;font-family:var(--font-display);font-weight:600;font-size:clamp(1.05rem,2vw,1.5rem);box-shadow:0 5px 0 var(--ink);margin-bottom:24px}
.bubble::before{content:"";position:absolute;left:-18px;bottom:22px;width:26px;height:26px;background:#fff;border-left:4px solid var(--ink);border-bottom:4px solid var(--ink);transform:rotate(45deg);border-bottom-left-radius:6px}
.bubble.good{background:var(--good-bg)}.bubble.good::before{background:var(--good-bg)}
.bubble.oops{background:var(--soft-bg)}.bubble.oops::before{background:var(--soft-bg)}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
.fly{position:fixed;left:0;top:0;width:44px;height:44px;z-index:90;pointer-events:none}
.fly svg{width:100%;height:100%;fill:var(--sun);stroke:var(--ink);stroke-width:2}

@media (max-width:900px){
  .mgrid{grid-template-columns:minmax(0,1fr)}
  .tray{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .hero,.q-grid{grid-template-columns:minmax(0,1fr)}
  .hero-art{order:-1}
  .bubble::before{display:none}
}
@media (max-width:520px){
  .trail li{font-size:.75rem}
  .trail li::after{left:calc(50% + 20px);right:calc(-50% + 20px)}
  .starrow svg{width:17px;height:17px}
  .opt{min-height:100px}
  .nav .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .scenery .cl{display:none}
}

<script>
/* ---------- Art: all pictures are drawn here as inline SVG ---------- */
const Art=(()=>{
  const INK='#1e2a5a';
  const ol=(w=3)=>`stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
  const sp=(cx,cy,R,r,n,rot)=>{
    rot=rot===undefined?-Math.PI/2:rot;const p=[];
    for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,d=i%2?r:R;p.push((cx+d*Math.cos(a)).toFixed(2)+','+(cy+d*Math.sin(a)).toFixed(2));}
    return p.join(' ');
  };
  const LEAF='50,5 58,22 66,17 63,40 78,33 74,45 92,48 82,58 86,66 68,66 71,80 54,74 54,95 46,95 46,74 29,80 32,66 14,66 18,58 8,48 26,45 22,33 37,40 34,17 42,22';
  const cloud=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})" fill="#fff"><ellipse rx="30" ry="14"/><ellipse cx="-20" cy="6" rx="20" ry="11"/><ellipse cx="22" cy="6" rx="22" ry="11"/></g>`;
  const wrap=(inner)=>`<svg class="art" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${inner}</svg>`;
  const pine=(x,y,s,c1,c2)=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-3" y="-6" width="6" height="12" fill="#7a4a2a"/><polygon points="0,-50 -16,-22 16,-22" fill="${c2}"/><polygon points="0,-36 -20,-8 20,-8" fill="${c1}"/><polygon points="0,-22 -24,6 24,6" fill="${c2}"/></g>`;
  const leaf=(x,y,rot,c)=>`<path transform="translate(${x} ${y}) rotate(${rot})" d="M0 0C10-12 30-12 42 0 30 12 10 12 0 0Z" fill="${c}" ${ol(2.5)}/>`;

  /* flags */
  const ukIn='<rect width="60" height="40" fill="#012169"/><path d="M0 0L60 40M60 0L0 40" stroke="#fff" stroke-width="7"/><path d="M0 0L60 40M60 0L0 40" stroke="#c8102e" stroke-width="2.4"/><path d="M30 0V40M0 20H60" stroke="#fff" stroke-width="11"/><path d="M30 0V40M0 20H60" stroke="#c8102e" stroke-width="6.5"/>';
  const flagIn=(c)=>{
    if(c==='uk')return ukIn;
    if(c==='au')return '<rect width="60" height="40" fill="#012169"/><svg x="0" y="0" width="30" height="20" viewBox="0 0 60 40">'+ukIn+'</svg>'

    return `<rect width="60" height="40" fill="#fff"/><rect width="15" height="40" fill="#d52b1e"/><rect x="45" width="15" height="40" fill="#d52b1e"/><polygon transform="translate(15 5) scale(.3)" points="${LEAF}" fill="#d52b1e"/>`;
  };

  S.koala=()=>wrap(sky('#c2eaff')+cloud(310,48,.9)+cloud(60,70,.7)

/* ---------- Sound effects (Web Audio, made in the browser) ---------- */
const SFX={
  ctx:null,muted:false,nb:null,
  init(){
    try{
      if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)this.ctx=new AC();}
      if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();
    }catch(e){}
  },
  ready(){return this.ctx&&!this.muted;},
  tone(f,t0,d,type,v){
    const c=this.ctx,o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(v||.2,t0+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+d+.05);
  },
  clap(t0,v){
    const c=this.ctx;
    if(!this.nb){const n=Math.floor(c.sampleRate*.12),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);this.nb=b;}
    const s=c.createBufferSource();s.buffer=this.nb;s.playbackRate.value=.8+Math.random()*.6;
    const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1200+Math.random()*1800;f.Q.value=.7;
    const g=c.createGain();g.gain.value=v;
    s.connect(f);f.connect(g);g.connect(c.destination);s.start(t0);
  },
  applause(len){
    if(!this.ready())return;
    const t=this.ctx.currentTime,n=Math.round(len*34);
    for(let i=0;i<n;i++){const k=Math.pow(Math.random(),.85)*len;this.clap(t+k,(.25+Math.random()*.45)*(1-k/(len*1.15)));}
  },
  win(){
    if(!this.ready())return;
    const t=this.ctx.currentTime;
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>this.tone(f,t+i*.09,.35,'triangle',.16));
    this.applause(1.6);
  },
  oops(){
    if(!this.ready())return;
    const t=this.ctx.currentTime;
    this.tone(392,t,.3,'sine',.12);this.tone(311.13,t+.2,.45,'sine',.1);
  },
  pop(){if(!this.ready())return;this.tone(660,this.ctx.currentTime,.09,'triangle',.08);},
  fanfare(){
    if(!this.ready())return;
    const t=this.ctx.currentTime;
    [[523.25,0,.18],[523.25,.2,.18],[523.25,.4,.18],[659.25,.6,.3],[783.99,.95,.25],[1046.5,1.25,.7]].forEach(n=>{this.tone(n[0],t+n[1],n[2]+.1,'triangle',.18);this.tone(n[0]/2,t+n[1],n[2]+.1,'sine',.1);});
    this.applause(3.2);
  }
};

/* ---------- Voice (the browser's own English voice) ---------- */
const TTS={
  ok:'speechSynthesis' in window&&'SpeechSynthesisUtterance' in window,
  voice:null,cur:null,
  load(){
    if(!this.ok)return;
    try{
      const vs=speechSynthesis.getVoices()||[];
      const en=vs.filter(v=>/^en([-_]|$)/i.test(v.lang));
      if(!en.length)return;
      const prefs=[/google uk english female/i,/microsoft (libby|sonia|maisie|jenny|aria)/i,/(samantha|karen|serena|moira|tessa|kate|susan|fiona)/i,/female/i];
      let v=null;
      for(const re of prefs){v=en.find(x=>re.test(x.name));if(v)break;}
      this.voice=v||en.find(x=>/en[-_]GB/i.test(x.lang))||en[0];
    }catch(e){}
  },
  stop(){if(this.ok){try{speechSynthesis.cancel();}catch(e){}}},
  say(text,o){
    o=o||{};
    if(!this.ok||SFX.muted)return false;
    if(!this.voice)this.load();
    try{
      const u=new SpeechSynthesisUtterance(text);
      if(this.voice){u.voice=this.voice;u.lang=this.voice.lang;}else u.lang='en-GB';
      u.rate=o.rate||.85;u.pitch=o.pitch||1.1;u.volume=1;
      let started=false;
      u.onstart=()=>{started=true;o.onstart&&o.onstart();};
      u.onend=()=>{o.onend&&o.onend();};
      u.onerror=(e)=>{if(e&&(e.error==='canceled'||e.error==='interrupted'))return;o.onfail&&o.onfail();};
      this.cur=u;
      speechSynthesis.cancel();
      setTimeout(()=>{
        try{speechSynthesis.speak(u);}catch(e){o.onfail&&o.onfail();}
        setTimeout(()=>{if(!started&&!speechSynthesis.speaking&&!speechSynthesis.pending)o.onfail&&o.onfail();},2800);
      },60);
      return true;
    }catch(e){o.onfail&&o.onfail();return false;}
  }
};
if(TTS.ok){TTS.load();try{speechSynthesis.onvoiceschanged=()=>TTS.load();}catch(e){}}

const cv=$('#confetti'),cx=cv.getContext('2d');
let parts=[],raf=0;
function sizeCv(){const d=Math.min(window.devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);}

function confetti(n){
  const cols=['#ff6a5c','#ffc93c','#2fb36b','#2f5fd0','#7a5cff','#ff9f1c','#ffffff'];
  n=REDUCE?Math.min(n||120,30):(n||120);
  for(let i=0;i<n;i++)parts.push({x:innerWidth*(.1+Math.random()*.8),y:-20-Math.random()*innerHeight*.35,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:6+Math.random()*8,c:rnd(cols),star:Math.random()<.28});
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.y<innerHeight+30);
  for(const p of parts){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.r+=p.vr;p.vx*=.995;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
    if(p.star){cx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,d=i%2?p.s*.5:p.s*1.1;cx.lineTo(Math.cos(a)*d,Math.sin(a)*d);}cx.closePath();cx.fill();}
    else cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);
    cx.restore();
  }
  raf=parts.length?requestAnimationFrame(tick):0;
  if(!parts.length)cx.clearRect(0,0,innerWidth,innerHeight);
}
function flyStar(from){
  const pill=$('#starPill');

  const el=document.createElement('div');el.className='fly';el.innerHTML=Art.star();document.body.appendChild(el);
  const x0=a.left+a.width/2-22,y0=a.top+a.height/2-22,x1=b.left+b.width/2-22,y1=b.top+b.height/2-22;

function lev(a,b){
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}
  return p[n];
}
function hitCountry(w){
  for(const k of KEYS)for(const v of VOC[k]){
    if(w===v)return k;
    if(w.length>=5&&v.length>=5&&lev(w,v)<=1)return k;
    if(w.length>=9&&v.length>=9&&lev(w,v)<=2)return k;
  }
  return null;
}

    const text=typed||built();
    if(!text){setFb(fb,'soft','Fill all the boxes, or type your own sentence.');return;}
    const words=(text.toLowerCase().match(/[a-z']+/g)||[]);
    if(words.length<2){setFb(fb,'soft','Nice start! Add a few more words. Try: Come to Australia.');return;}
    const tally={au:0,ca:0,uk:0};words.forEach(w=>{const k=hitCountry(w);if(k)tally[k]++;});
    let best=KEYS.reduce((a,k)=>tally[k]>tally[a]?k:a,'au');if(!tally[best])best=null;
    const sample=SAMPLE[best||rnd(KEYS)];
    const praise=rnd(['Wonderful writing!','Great sentence!','Amazing work, explorer!','Well done!']);
    $('#sample').innerHTML=`<div class="bubble2 mine"><b>Your sentence</b>${esc(text)}</div><div class="bubble2"><b>A sample sentence</b>${esc(sample)}</div>`;
    setFb(fb,'good',praise+(best?` I can see you wrote about ${CTRY[best].name}.`:' I understand your idea!'));
    if(!rewarded){rewarded=true;award(true,$('#sub'));}
    else{SFX.win();confetti(60);Mas.cheer(praise);}
    $('#nav').innerHTML='<button class="btn go" id="nx">Finish the quiz</button>';
    $('#nx').onclick=()=>{SFX.pop();screenFinal();};
  };
  setTpl(0);
}

/* ----- Final ----- */
function screenFinal(){
  G.sec=5;
  const pct=Math.round(G.correct/TOTAL*100),gold=pct>=80;
  const nm=G.name||'World Explorer';
  render(`<section class="panel final">
    <h2>Congratulations, World Explorer!</h2>
    <p class="lead">${gold?'You won the GOLD TROPHY! You are a super traveller!':'You travelled to three countries. You earned a Star Explorer badge! Play again to win the gold trophy.'}</p>
    <div class="stats">
      <div class="stat"><b>${G.score}</b><span>Score out of ${MAXPTS}</span></div>
      <div class="stat"><b>${G.correct} / ${TOTAL}</b><span>Correct answers</span></div>
      <div class="stat"><b>${G.stars}</b><span>Stars collected</span></div>
    </div>
    <div class="bigstars" aria-label="${G.stars} stars">${Array.from({length:TOTAL},(_,i)=>Art.star(i<G.stars?'':'off')).join('')}</div>
    <div class="cert">
      <div class="ribbon">World Explorer Certificate</div>
      ${Art.trophy(gold?'gold':'silver')}
      <p class="tiny">This certificate is for</p>
      <div class="nm">${esc(nm)}</div>
      <p class="lead">${gold?'Gold Trophy Winner':'Star Explorer'}</p>
      <p>for travelling to Australia, Canada and the UK!</p>
      <div class="fl3">${KEYS.map(k=>`<div>${Art.flag(k)}</div>`).join('')}</div>
      <p class="tiny">${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</p>
    </div>
    <div class="row" style="justify-content:center"><button class="btn go" id="again">Play again</button></div>
  </section>`,gold?'You are a champion! Hooray!':'Great job! You are a star!');
  Mas.cheer(gold?'You are a champion! Hooray!':'Great job! You are a star!');
  SFX.fanfare();confetti(220);setTimeout(()=>confetti(140),900);
  TTS.say('Congratulations, World Explorer!',{rate:.9,pitch:1.25});
  $('#again').onclick=()=>{SFX.pop();screenStart();};
}

/* ---------- Go ---------- */
screenStart();

</script>
